<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/public/logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fafafa"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#18181b"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mercur Admin" />
    <meta name="msapplication-TileColor" content="#4C24DD" />
    <title>Mercur Admin</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("medusa_admin_theme") || "system";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var scheme =
            theme === "dark" || (theme !== "light" && dark) ? "dark" : "light";
          var html = document.documentElement;
          html.classList.add(scheme);
          html.style.colorScheme = scheme;
          if (localStorage.getItem("medusa_admin_liquid_glass") !== "false") {
            html.classList.add("liquid-glass");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
