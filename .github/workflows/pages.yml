name: Deploy Pages

on:
  push:
    branches: [main]
    # This repo's Pages site only hosts the two JSON Schema files. A deploy is
    # only needed when they (or this workflow) change.
    paths:
      - registry.json
      - registry-item.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; let it finish so Pages doesn't get
# left in a half-synced state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy registry schemas
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      # Ensures Pages is using the GitHub Actions source before deploy-pages
      # talks to the Pages API (a missing/disabled site returns 404).
      - name: Configure Pages
        uses: actions/configure-pages@v6

      # Publish only the schema files. Do not ship a CNAME — this copy of the
      # repo is served at username.github.io/Marketplace, not registry.mercurjs.com.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp registry.json registry-item.json _site/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # The deploy itself is reliable; what's flaky is the action's status
      # poll — GitHub's Pages backend occasionally returns a transient error
      # while still provisioning, which the action treats as terminal
      # ("Deployment failed, try again later") even though the deploy then
      # succeeds. A higher error_count rides through those transient errors
      # instead of aborting on the first one.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
          error_count: 25
          reporting_interval: 5000
